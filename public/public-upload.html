<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sube tus documentos — InmoBuró</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body style="background:linear-gradient(135deg,var(--navy-900),var(--navy-700));min-height:100vh">

<div style="max-width:640px;margin:60px auto;padding:0 20px">
  <div style="text-align:center;margin-bottom:30px;color:white">
    <div class="logo" style="justify-content:center;margin-bottom:16px"><span class="logo-mark">I</span><span>InmoBuró</span></div>
    <h1 style="font-size:32px;font-weight:800;letter-spacing:-.8px">Sube tus documentos</h1>
    <p style="color:rgba(255,255,255,.7);margin-top:8px">Tu asesor inmobiliario te invita a completar tu solicitud de renta. Sube cada documento en su categoría.</p>
  </div>

  <div class="card" style="padding:32px">
    <div style="display:grid;gap:14px" id="doc-list">
      <!-- populated by JS -->
    </div>
    <p style="margin-top:20px;font-size:13px;color:var(--gray-500);text-align:center">Tus documentos están cifrados y solo son visibles para tu asesor. No los compartimos con terceros.</p>
  </div>
</div>

<script>
const token = location.pathname.split('/').pop();
const types = [
  { id:'ine', name:'Identificación oficial (INE/Pasaporte)', icon:'🪪' },
  { id:'domicilio', name:'Comprobante de domicilio', icon:'🏠' },
  { id:'ingresos', name:'Comprobantes de ingresos (3 últimos)', icon:'💰' },
  { id:'banco', name:'Estado de cuenta bancario', icon:'🏦' },
  { id:'empleo', name:'Constancia de empleo', icon:'💼' },
  { id:'referencias', name:'Referencias personales', icon:'👥' }
];

function render(uploaded = {}) {
  document.getElementById('doc-list').innerHTML = types.map(t => `
    <div style="display:flex;align-items:center;gap:14px;padding:18px;background:var(--gray-50);border-radius:12px;border:2px dashed ${uploaded[t.id]?'var(--teal-500)':'var(--gray-200)'}">
      <div style="font-size:28px">${t.icon}</div>
      <div style="flex:1">
        <div style="font-weight:700;color:var(--navy-900)">${t.name}</div>
        <div style="font-size:13px;color:var(--gray-500)">${uploaded[t.id] ? '✅ Subido' : 'PDF, JPG o PNG · máx 10MB'}</div>
      </div>
      <label class="btn btn-${uploaded[t.id]?'outline':'primary'} btn-sm">
        ${uploaded[t.id]?'Reemplazar':'Subir archivo'}
        <input type="file" style="display:none" accept=".pdf,.jpg,.jpeg,.png" onchange="upload('${t.id}', this)">
      </label>
    </div>
  `).join('');
}
render();

async function upload(type, input) {
  if (!input.files[0]) return;
  const fd = new FormData();
  fd.append('file', input.files[0]);
  fd.append('type', type);
  try {
    const r = await fetch('/api/documents/public/' + token + '/upload', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    const uploaded = JSON.parse(sessionStorage.getItem('uploaded')||'{}');
    uploaded[type] = true;
    sessionStorage.setItem('uploaded', JSON.stringify(uploaded));
    render(uploaded);
  } catch (e) { alert('Error: ' + e.message); }
}
</script>
</body>
</html>
